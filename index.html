<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incentivos TYT</title>
<meta name="description" content="Plataforma de incentivos TYT: metas volantes, días de marca y ofertas específicas.">
<meta name="theme-color" content="#DA291C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23DA291C%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2232%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3ETYT%3C/text%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: operativo, claro, de oficina comercial; nada decorativo.
   IDEA: tablero de incentivos tipo planilla oficial de liquidación.
   PICTURE: la herramienta misma (formularios, cola de aprobación, metas del aliado).
   COLOUR and TYPE: rojo corporativo #DA291C, blanco, gris claro, negro; Schibsted Grotesk.
   LAYOUT: barra esmeralda arriba, pestañas, una columna de tarjetas; tablas apiladas en móvil. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#141414);--ink:light-dark(#1a1a1a,#f2f2f2);--mut:light-dark(#5f5f5f,#b0b0b0);--em:#DA291C;--emd:light-dark(#b51f14,#ff6a5c);--pk:light-dark(#fde3e1,#4a1a16);--pki:light-dark(#9e1b12,#ffc9c4);--ln:light-dark(#e3e3e3,#333);--pn:light-dark(#f5f5f5,#1f1f1f);--ok:light-dark(#e3f3e8,#12331f);--oki:light-dark(#1b6b38,#8fdcaa);--am:light-dark(#fff1c9,#3d3210);--ami:light-dark(#6b5000,#ffe08a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(24px,5vw,34px);font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:700}
.top{background:var(--em);color:#fff;padding:14px max(4vw,16px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .who{margin-left:auto;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top b{font-weight:800}
.wrap{max-width:1000px;margin:0 auto;padding:20px max(4vw,16px) 60px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px}
.tab{flex:none;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 16px;font:600 15px/1 inherit;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{border:1.5px solid var(--ln);border-radius:14px;padding:16px;margin:0 0 14px;background:var(--bg)}
.card.pn{background:var(--pn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;font:16px inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--em);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:12px 18px;font:700 15px/1 inherit;cursor:pointer;min-height:44px;background:var(--em);color:#fff}
.btn.sec{background:var(--pn);color:var(--ink);border:1.5px solid var(--ln)}
.btn.no{background:var(--pk);color:var(--pki)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.top .btn{background:#fff;color:#b51f14}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.p-pendiente{background:var(--am);color:var(--ami)}.p-aprobado{background:var(--ok);color:var(--oki)}.p-rechazado{background:var(--pk);color:var(--pki)}
.tag{display:inline-block;border:1.5px solid var(--ln);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;padding:6px 6px;border-bottom:1.5px solid var(--ln)}
td{padding:7px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td input,td select{min-height:40px;padding:7px 9px}
.big{font-size:clamp(30px,7vw,44px);font-weight:800;line-height:1}
.mut{color:var(--mut);font-size:14px}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:10px 0}
.hero div{background:var(--pn);border-radius:10px;padding:12px}
.hero b{display:block;font-size:24px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;color:var(--mut);text-align:center;font-weight:600}
.cal .d{border:1px solid var(--ln);border-radius:8px;min-height:62px;padding:4px;font-size:12px}
.cal .d.on{background:var(--em);color:#fff;border-color:var(--em)}
.cal .d span{display:block;font-weight:800;font-size:11px;overflow-wrap:anywhere;line-height:1.1;margin-top:3px}
.login{max-width:440px;margin:6vh auto 0}
.mesbar{display:flex;align-items:center;gap:10px;margin:0 0 16px}.mesbar label{margin:0;color:var(--ink);font-size:15px}.mesbar select{width:auto;min-width:220px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}.day{border:2px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font:inherit;min-height:44px}.day b{display:block;font-size:17px}.day b::first-letter{text-transform:uppercase}.day span{font-size:13px;color:var(--mut)}.day.on{border-color:var(--em);background:var(--pk)}.day.on span{color:var(--pki)}
.logo{width:36px;height:36px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--ln);display:inline-grid;place-items:center;font-weight:800;font-size:13px;color:#DA291C;flex:none}.logo.lg{width:56px;height:56px;font-size:18px}
.empty{padding:22px;text-align:center;color:var(--mut);border:1.5px dashed var(--ln);border-radius:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:var(--ink);margin:0}
.chk input{width:20px;height:20px;min-height:0}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:6px;margin-top:6px}
.scroll{overflow-x:auto}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--ln)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}.cal .d{min-height:48px}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>

<script>
{
const ALIADOS=["ALTYCOM BARRANQUILLA","CONEXIONES DIGITALES","CONEXIONES DIGITALES BARRANQUILLA","CONTACTMASTER BPO MANIZALES","COS BARRANQUILLA","GNP CALI","VOICETECH MEDELLIN","BENTOINT","COS BOGOTA","ONE CONTACT BOGOTA","VECTOR BOGOTA","ASISTE ING","GNP","ARCOS BOGOTA","ATENTO BOGOTA"];
const MARCAS=["HONOR","HUAWEI","KALLEY","MOTOROLA","OPPO","SAMSUNG","TCL","TECNO","VIVO","XIAOMI","ZTE","TECNOLOGIA"];

const TIPOS={meta:"Meta volante",dia:"Día de marca",oferta:"Oferta específica"};
const linea=m=>m==="TECNOLOGIA"?"Tecnología":"Terminales";
const nom=m=>m==="TECNOLOGIA"?"Tecnología":m[0]+m.slice(1).toLowerCase();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>v?"$"+Number(v).toLocaleString("es-CO"):"—";
const num=v=>Number(v||0).toLocaleString("es-CO",{maximumFractionDigits:2});
const fm=(v,u)=>u==="mill"?"$"+num(v)+" M":num(v)+" und";
const ub=(u,m)=>[u?num(u)+" und":"",m?"$"+num(m)+" M":""].filter(Boolean).join(" · ")||"—";
const mU=m=>Number(m.und||0),mM=m=>Number(m.mill||0),hasM=m=>m&&(mU(m)>0||mM(m)>0);
const fdate=s=>{if(!s)return"";const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CO",{weekday:"short",day:"numeric",month:"short"})};
const KEY="tyt-incentivos-v6";
const mesOf=it=>(it.tipo==="dia"?it.d.fecha:it.d.desde||"").slice(0,7);
const mesLabel=k=>{const[y,m]=k.split("-").map(Number);const t=new Date(y,m-1,1).toLocaleDateString("es-CO",{month:"long",year:"numeric"});return t[0].toUpperCase()+t.slice(1)};
const mesCorto=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("es-CO",{month:"long"})};
const lastDay=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const hoyMes=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const sigMes=k=>{const[y,m]=k.split("-").map(Number);const d=new Date(y,m,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};

function seed(){
  const metas=(vu,vm)=>Object.fromEntries(ALIADOS.map((a,i)=>[a,{und:vu?vu[i]||0:0,mill:vm?vm[i]||0:0,cat:["A","B","C"][i%3]}]));
  const pct=(v,k)=>v.map(x=>Math.round(x*k));
  return{
    cal:{"2026-11-14":"SAMSUNG","2026-11-21":"OPPO","2026-12-05":"SAMSUNG","2026-12-06":"SAMSUNG","2026-12-11":"MOTOROLA","2026-12-12":"OPPO","2026-12-18":"XIAOMI","2026-12-19":"VIVO","2026-12-20":"TECNOLOGIA"},
    items:[
      {id:1,marca:"OPPO",tipo:"meta",estado:"aprobado",por:"Gina Bermúdez",d:{objU:4500,objM:1350,desde:"2026-12-01",hasta:"2026-12-31",metas:metas([520,410,260,300,380,240,330,180,350,290,310,150,220,280,260],pct([520,410,260,300,380,240,330,180,350,290,310,150,220,280,260],0.3)),pagos:[{ref:"Reno 14 Pro 512 GB",ali:70000,staff:15000,ase:15000},{ref:"Reno 14 256 GB",ali:56000,staff:12000,ase:12000},{ref:"A80 5G",ali:42000,staff:9000,ase:9000},{ref:"A40 128 GB",ali:28000,staff:6000,ase:6000}],cond:"Solo ventas efectivas en el informe oficial. Corte 31 dic, pago estimado 20 ene. Valores antes de IVA."}},
      {id:2,marca:"VIVO",tipo:"meta",estado:"pendiente",d:{objU:3200,objM:0,desde:"2026-12-01",hasta:"2026-12-31",metas:metas([300,250,180,200,260,150,240,120,230,200,210,110,160,190,200]),pagos:[{ref:"V50 256 GB",ali:60000,staff:12000,ase:13000},{ref:"Y29 128 GB",ali:30000,staff:6000,ase:7000}],cond:"Corte 31 dic. Valores con IVA."}},
      {id:3,marca:"SAMSUNG",tipo:"dia",estado:"aprobado",por:"César",d:{fecha:"2026-12-05",titulo:"Galaxy Weekend",aliados:"todos",pagos:[{ref:"Galaxy A56 5G",ali:20000,staff:5000,ase:10000},{ref:"Galaxy A26",ali:12000,staff:3000,ase:6000}],cond:"Aplica a ventas activadas el mismo día."}},
      {id:4,marca:"XIAOMI",tipo:"oferta",estado:"aprobado",por:"Gina Bermúdez",d:{titulo:"Hoy pagamos $25.000 por Redmi Note 15",desde:"2026-12-03",hasta:"2026-12-04",aliados:"todos",pagos:[{ref:"Redmi Note 15 256 GB",ali:0,staff:0,ase:25000}],cond:"Solo ventas del 3 y 4 de diciembre."}},
      {id:5,marca:"TECNOLOGIA",tipo:"meta",estado:"aprobado",por:"César",d:{objU:900,objM:0,desde:"2026-12-01",hasta:"2026-12-31",metas:metas([90,70,40,60,80,40,70,30,70,60,60,30,50,60,90]),pagos:[{ref:"Portátiles gama media",ali:40000,staff:8000,ase:10000},{ref:"Smartwatch",ali:15000,staff:3000,ase:5000}],cond:"Línea de tecnología. Corte 31 dic."}},
      {id:6,marca:"MOTOROLA",tipo:"dia",estado:"pendiente",d:{fecha:"2026-12-11",titulo:"Moto Day",aliados:["COS BOGOTA","ATENTO BOGOTA","ARCOS BOGOTA"],pagos:[{ref:"moto g86",ali:15000,staff:4000,ase:8000}],cond:"Solo sedes Bogotá."}},
      ...[["SAMSUNG",7,60,"aprobado","César",1],["XIAOMI",8,450,"aprobado","Gina Bermúdez"],["HONOR",9,250,"aprobado","Gina Bermúdez"],["MOTOROLA",10,350,"aprobado","César"],["TCL",11,200,"pendiente"]].map(([m,id,b,e,por,u])=>({id,marca:m,tipo:"meta",estado:e,por,d:{objU:u?0:b*15,objM:u?b*15:0,desde:"2026-12-01",hasta:"2026-12-31",metas:(v=>u?metas(null,v):metas(v))(ALIADOS.map((_,i)=>Math.round(b*(0.5+((i*37+id)%10)/10)))),pagos:[{ref:"Gama alta",ali:60000,staff:12000,ase:12000},{ref:"Gama media",ali:40000,staff:8000,ase:8000},{ref:"Gama entrada",ali:20000,staff:4000,ase:5000}],cond:"Solo ventas efectivas en el informe oficial. Corte 31 dic."}}))
      ,{id:12,marca:"SAMSUNG",tipo:"dia",estado:"aprobado",por:"Gina Bermúdez",d:{fecha:"2026-12-06",titulo:"Domingo Galaxy Tab",aliados:"todos",pagos:[{ref:"Galaxy Tab A9+",ali:15000,staff:4000,ase:8000},{ref:"Galaxy Watch8",ali:10000,staff:2000,ase:5000}],cond:"Concurso distinto al del sábado. Aplica solo a ventas del 6 de diciembre."}}
      ,{id:13,marca:"OPPO",tipo:"meta",estado:"aprobado",por:"César",d:{objU:4000,objM:0,desde:"2026-11-01",hasta:"2026-11-30",metas:metas([480,380,240,280,350,220,300,160,320,270,290,140,200,260,240]),pagos:[{ref:"Reno 13 256 GB",ali:60000,staff:12000,ase:12000},{ref:"A60 128 GB",ali:25000,staff:5000,ase:5000}],cond:"Mes cerrado. Corte 30 nov."}}
      ,{id:14,marca:"SAMSUNG",tipo:"meta",estado:"aprobado",por:"Gina Bermúdez",d:{objU:0,objM:800,desde:"2026-11-01",hasta:"2026-11-30",metas:metas(null,[65,50,30,40,55,30,45,20,45,40,40,20,30,35,40]),pagos:[{ref:"Gama alta",ali:55000,staff:11000,ase:11000},{ref:"Gama media",ali:35000,staff:7000,ase:7000}],cond:"Mes cerrado. Corte 30 nov."}}
      ,{id:15,marca:"SAMSUNG",tipo:"dia",estado:"aprobado",por:"César",d:{fecha:"2026-11-14",titulo:"Galaxy Black Days",aliados:"todos",pagos:[{ref:"Galaxy A36 5G",ali:18000,staff:4000,ase:9000}],cond:"Solo ventas del 14 de noviembre."}}
      ,{id:16,marca:"XIAOMI",tipo:"oferta",estado:"aprobado",por:"Gina Bermúdez",d:{titulo:"Redmi 14C a $15.000 por venta",desde:"2026-11-27",hasta:"2026-11-28",aliados:"todos",pagos:[{ref:"Redmi 14C 128 GB",ali:0,staff:0,ase:15000}],cond:"Black Friday."}}
    ],logos:{},next:17};
}
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db){try{const o=JSON.parse(localStorage.getItem("tyt-incentivos-v5"));if(o){db=seed();db.pw=o.pw||{};db.logos=o.logos||{}}}catch(e){}}
if(!db||!db.items)db=seed();db.logos=db.logos||{};db.pw=db.pw||{};
const hash=async t=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("tyt:"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"p:"+t}};
const ukey=()=>S.user.role+"|"+S.user.name;
const checkPw=async(k,p)=>db.pw[k]?(await hash(p))===db.pw[k]:p==="1234";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const S={user:null,tab:null,lin:"Todas",rej:null,dia:null,mes:null};
const meses=()=>{const set=new Set([hoyMes(),sigMes(hoyMes())]);db.items.forEach(i=>{const m=mesOf(i);if(m)set.add(m)});Object.keys(db.cal).forEach(k=>set.add(k.slice(0,7)));return[...set].sort().reverse()};
const defMes=()=>{const ds=new Set(db.items.map(mesOf));const l=meses().filter(m=>ds.has(m));return l.includes(hoyMes())&&!ds.has(sigMes(hoyMes()))?hoyMes():(l[0]||hoyMes())};
const enMes=it=>mesOf(it)===S.mes;
const app=document.getElementById("app");
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)};

const logo=(m,big)=>db.logos[m]?`<img class="logo${big?" lg":""}" src="${db.logos[m]}" alt="Logo ${esc(nom(m))}">`:`<span class="logo${big?" lg":""}" aria-hidden="true">${esc(nom(m).slice(0,2).toUpperCase())}</span>`;
const forAli=(it,a)=>it.tipo==="meta"?hasM(it.d.metas[a]):(it.d.aliados==="todos"||(it.d.aliados||[]).includes(a));

function payTable(p,cols){
  const C={ali:"Pago aliado",staff:"Pago staff",ase:"Pago asesor"};
  return`<table class="stack"><thead><tr><th>Referencia</th>${cols.map(c=>`<th class="n">${C[c]}</th>`).join("")}</tr></thead><tbody>${p.map(r=>`<tr><td>${esc(r.ref)}</td>${cols.map(c=>`<td class="n">${money(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function detail(it,ali){
  const d=it.d;let h="";
  if(it.tipo==="meta"){
    if(ali){const m=d.metas[ali];h+=`<div class="hero"><div><span class="mut">Tu meta</span><b>${ub(mU(m),mM(m))}</b></div><div><span class="mut">Categoría</span><b>${esc(m.cat)}</b></div><div><span class="mut">Vigencia</span><b style="font-size:16px">${fdate(d.desde)} – ${fdate(d.hasta)}</b></div></div>`}
    else{const tu=Object.values(d.metas).reduce((s,m)=>s+mU(m),0),tm=Object.values(d.metas).reduce((s,m)=>s+mM(m),0);
      h+=`<div class="hero"><div><span class="mut">Objetivo total</span><b>${ub(d.objU,d.objM)}</b></div><div><span class="mut">Suma por aliado</span><b>${ub(tu,tm)}</b></div><div><span class="mut">Vigencia</span><b style="font-size:16px">${fdate(d.desde)} – ${fdate(d.hasta)}</b></div></div>`;
      h+=`<details><summary>Meta por aliado (${Object.values(d.metas).filter(hasM).length})</summary><table class="stack"><thead><tr><th>Aliado</th><th class="n">Unidades</th><th class="n">Millones</th><th>Cat.</th></tr></thead><tbody>${Object.entries(d.metas).filter(([,m])=>hasM(m)).map(([a,m])=>`<tr><td>${esc(a)}</td><td class="n">${mU(m)?num(mU(m)):""}</td><td class="n">${mM(m)?"$"+num(mM(m))+" M":""}</td><td>${esc(m.cat)}</td></tr>`).join("")}</tbody></table></details>`}
  }else{
    h+=`<p style="margin:6px 0"><b>${esc(d.titulo)}</b><br><span class="mut">${it.tipo==="dia"?fdate(d.fecha):fdate(d.desde)+" – "+fdate(d.hasta)}${ali?"":" · "+(d.aliados==="todos"?"Todos los aliados":esc(d.aliados.join(", ")))}</span></p>`;
  }
  h+=payTable(d.pagos,["ali","staff","ase"]);
  if(d.cond)h+=`<p class="note"><b>Condiciones:</b> ${esc(d.cond)}</p>`;
  return h;
}
function itemCard(it,mode){
  let actions="";
  if(mode==="jefe"&&it.estado==="pendiente"){
    actions=S.rej===it.id?`<div style="margin-top:12px"><label for="rc">Motivo del rechazo</label><textarea id="rc" placeholder="Qué debe corregir la marca"></textarea><div class="row" style="margin-top:8px"><button class="btn no" data-act="rej-ok" data-id="${it.id}">Confirmar rechazo</button><button class="btn sec" data-act="rej-x">Cancelar</button></div></div>`
    :`<div class="row" style="margin-top:12px"><button class="btn" data-act="ok" data-id="${it.id}">✓ Aprobar y publicar</button><button class="btn no" data-act="rej" data-id="${it.id}">Rechazar</button></div>`;
  }
  const st=it.estado==="aprobado"&&it.por?` por ${esc(it.por)}`:"";
  return`<div class="card"><div class="row" style="justify-content:space-between"><div class="row">${logo(it.marca)}<h3>${nom(it.marca)} · ${TIPOS[it.tipo]}</h3></div>${mode==="ali"?`<span class="tag">${linea(it.marca)}</span>`:`<span class="pill p-${it.estado}">${it.estado[0].toUpperCase()+it.estado.slice(1)}${st}</span>`}</div>${it.coment?`<p class="note" style="color:var(--pki)"><b>Comentario del jefe:</b> ${esc(it.coment)}</p>`:""}${detail(it,mode==="ali"?S.user.name:null)}${actions}</div>`;
}
function tabs(list){if(!list.some(t=>t[0]===S.tab))S.tab=list[0][0];return`<div class="tabs" role="tablist">${list.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l}</button>`).join("")}</div>`}
function calendar(){
  const[cy,cm]=S.mes.split("-").map(Number),first=new Date(cy,cm-1,1),off=(first.getDay()+6)%7;let c="";
  ["L","M","M","J","V","S","D"].forEach(x=>c+=`<div class="h">${x}</div>`);
  for(let i=0;i<off;i++)c+="<div></div>";
  for(let d=1;d<=lastDay(S.mes);d++){const k=`${S.mes}-${String(d).padStart(2,"0")}`,m=db.cal[k];c+=`<div class="d${m?" on":""}">${d}${m?`<span>${nom(m)}</span>`:""}</div>`}
  return`<div class="cal">${c}</div>`;
}
const payRow=(r={})=>`<tr><td><input name="ref" value="${esc(r.ref)}" placeholder="Referencia o familia"></td><td><input name="ali" type="number" inputmode="numeric" value="${r.ali||""}" placeholder="0"></td><td><input name="staff" type="number" inputmode="numeric" value="${r.staff||""}" placeholder="0"></td><td><input name="ase" type="number" inputmode="numeric" value="${r.ase||""}" placeholder="0"></td><td><button type="button" class="btn sec sm" data-act="delrow" aria-label="Quitar fila">✕</button></td></tr>`;
const payEditor=()=>`<h3 style="margin:18px 0 4px">Tabla de pago por referencia</h3><p class="note" style="margin:0 0 8px">Valores en pesos por unidad vendida.</p><table class="stack" id="pays"><thead><tr><th>Referencia</th><th>Pago aliado</th><th>Pago staff</th><th>Pago asesor</th><th></th></tr></thead><tbody>${payRow()}${payRow()}</tbody></table><button type="button" class="btn sec sm" style="margin-top:8px" data-act="addrow">+ Agregar referencia</button>`;
const aliPick=()=>`<label class="chk" style="margin-top:14px"><input type="checkbox" id="todos" checked> Aplica a todos los aliados</label><div class="chks" id="alis" hidden>${ALIADOS.map(a=>`<label class="chk"><input type="checkbox" value="${esc(a)}"> ${esc(a)}</label>`).join("")}</div>`;

function brandForm(){
  const m=S.user.name;
  if(S.tab==="meta")return`<form class="card pn" id="f"><h2>Nueva meta volante de ${mesCorto(S.mes)}</h2><p class="mut">Formato único: objetivo, meta y categoría por aliado, pagos y condiciones.</p><div class="grid"><div><label for="obju">Objetivo total en unidades</label><input id="obju" type="number" inputmode="numeric" min="0" placeholder="0"></div><div><label for="objm">Objetivo total en millones</label><input id="objm" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div><div><label for="d1">Desde</label><input id="d1" type="date" value="${S.mes}-01" required></div><div><label for="d2">Hasta</label><input id="d2" type="date" value="${S.mes}-${lastDay(S.mes)}" required></div></div><h3 style="margin:18px 0 8px">Meta por aliado</h3><table class="stack"><thead><tr><th>Aliado</th><th>Unidades</th><th>Millones</th><th>Categoría</th></tr></thead><tbody>${ALIADOS.map((a,i)=>`<tr><td>${esc(a)}</td><td><input type="number" inputmode="numeric" min="0" data-u="${i}" placeholder="0"></td><td><input type="number" inputmode="decimal" step="any" min="0" data-m="${i}" placeholder="0"></td><td><select data-cat="${i}"><option>A</option><option>B</option><option>C</option></select></td></tr>`).join("")}</tbody></table><p class="note">Llena unidades, millones o las dos, según la meta de la marca. Millones en millones de pesos (ej.: 85,5 = $85.500.000). Un aliado sin unidades ni millones no verá esta meta volante.</p>${payEditor()}<label for="cond" style="margin-top:16px">Condiciones (corte, fecha de pago, con o sin IVA)</label><textarea id="cond"></textarea><button class="btn" style="margin-top:14px;width:100%">Enviar a aprobación</button></form>`;
  if(S.tab==="dia"){const days=Object.entries(db.cal).filter(([k,b])=>b===m&&k.startsWith(S.mes)).map(([k])=>k).sort();
    if(!days.length)return`<div class="empty">TYT todavía no te ha asignado días de marca en ${mesCorto(S.mes)}. Cuando el jefe de canal te asigne días, aparecerán aquí.</div>`;
    if(!days.includes(S.dia))S.dia=days[0];
    const st=k=>{const l=db.items.filter(i=>i.marca===m&&i.tipo==="dia"&&i.d.fecha===k);if(!l.length)return"Sin concurso";const c=e=>l.filter(i=>i.estado===e).length;return[c("aprobado")&&c("aprobado")+" aprobado",c("pendiente")&&c("pendiente")+" pendiente",c("rechazado")&&c("rechazado")+" rechazado"].filter(Boolean).join(" · ")};
    return`<div class="card"><h2>Tus días de marca</h2><p class="mut">Elige el día y monta un concurso distinto para cada uno.</p><div class="days">${days.map(k=>`<button type="button" class="day${S.dia===k?" on":""}" data-day="${k}"><b>${fdate(k)}</b><span>${st(k)}</span></button>`).join("")}</div></div><form class="card pn" id="f"><h2>Concurso del ${fdate(S.dia)}</h2><p class="mut">Este concurso aplica solo para ese día.</p><input type="hidden" id="fecha" value="${S.dia}"><label for="tit">Nombre del concurso</label><input id="tit" required placeholder="Ej.: ${nom(m)} Day">${aliPick()}${payEditor()}<label for="cond" style="margin-top:16px">Condiciones</label><textarea id="cond"></textarea><button class="btn" style="margin-top:14px;width:100%">Enviar concurso del ${fdate(S.dia)} a aprobación</button></form>`}
  return`<form class="card pn" id="f"><h2>Nueva oferta específica</h2><p class="mut">Incentivos puntuales, como “hoy pagamos $25.000 por esta referencia”.</p><div class="grid"><div style="grid-column:1/-1"><label for="tit">Título de la oferta</label><input id="tit" required></div><div><label for="d1">Desde</label><input id="d1" type="date" required></div><div><label for="d2">Hasta</label><input id="d2" type="date" required></div></div>${aliPick()}${payEditor()}<label for="cond" style="margin-top:16px">Condiciones</label><textarea id="cond"></textarea><button class="btn" style="margin-top:14px;width:100%">Enviar a aprobación</button></form>`;
}
function viewBrand(){
  if(!["meta","dia","oferta"].includes(S.tab))S.tab="meta";
  if(S.tab==="dia"){const ds=Object.entries(db.cal).filter(([k,b])=>b===S.user.name&&k.startsWith(S.mes)).map(([k])=>k).sort();if(!ds.includes(S.dia))S.dia=ds[0]||null}
  const mine=db.items.filter(i=>enMes(i)&&i.marca===S.user.name&&i.tipo===S.tab&&(S.tab!=="dia"||i.d.fecha===S.dia)).sort((a,b)=>b.id-a.id);
  const lg=`<div class="card row" style="justify-content:space-between"><div class="row">${logo(S.user.name,1)}<div><h3>${nom(S.user.name)}</h3><span class="mut">${db.logos[S.user.name]?"Este logo lo ven los jefes y los aliados.":"Sube el logo de tu marca (PNG o JPG)."}</span></div></div><label class="btn sec sm" style="margin:0;color:var(--ink)">${db.logos[S.user.name]?"Cambiar logo":"Subir logo"}<input type="file" id="logoin" accept="image/*" hidden></label></div>`;
  return lg+tabs([["meta","Meta volante"],["dia","Días de marca"],["oferta","Ofertas"]])+(()=>{const f=brandForm();return f})()+`<h2 style="margin:22px 0 10px">${S.tab==="dia"&&S.dia?"Mis concursos del "+fdate(S.dia):"Mis envíos"}</h2>`+(mine.length?mine.map(i=>itemCard(i,"brand")).join(""):`<div class="empty">Aún no has enviado ${TIPOS[S.tab].toLowerCase()}.</div>`);
}
function viewJefe(){
  const cnt=e=>db.items.filter(i=>enMes(i)&&i.estado===e).length;
  let h=tabs([["pendiente",`Pendientes (${cnt("pendiente")})`],["aprobado",`Aprobados (${cnt("aprobado")})`],["rechazado",`Rechazados (${cnt("rechazado")})`],["cal","Calendario"],["usr","Usuarios"]]);
  if(S.tab==="usr"){const g=(t,arr,f)=>`<optgroup label="${t}">${arr.map(x=>`<option value="${f}|${esc(x)}">${f==="brand"?nom(x):esc(x)} ${db.pw[f+"|"+x]?"· propia":"· inicial"}</option>`).join("")}</optgroup>`;return h+`<form class="card pn" id="frst"><h2>Restablecer contraseña</h2><p class="mut">Si una marca, un aliado o el otro jefe olvida su contraseña, vuelve a quedar en 1234 y debe cambiarla al entrar.</p><label for="ru">Usuario</label><select id="ru">${g("Marcas",MARCAS,"brand")}${g("Jefes de canal",JEFES,"jefe")}${g("Aliados",ALIADOS,"ali")}</select><button class="btn" style="margin-top:12px">Restablecer a 1234</button></form>`}
  if(S.tab==="cal")return h+`<div class="card"><h2>Días de marca · ${mesCorto(S.mes)}</h2><p class="note" style="margin-bottom:10px">Calendario de ejemplo mientras llega el real.</p>${calendar()}</div><form class="card pn" id="fcal"><h3>Asignar o quitar un día</h3><div class="grid" style="margin-top:8px"><div><label for="cd">Día</label><input id="cd" type="date" min="${S.mes}-01" max="${S.mes}-${lastDay(S.mes)}" value="${S.mes}-01"></div><div><label for="cm">Marca</label><select id="cm"><option value="">— Sin marca —</option>${MARCAS.map(m=>`<option value="${m}">${nom(m)}</option>`).join("")}</select></div></div><button class="btn" style="margin-top:12px">Guardar día</button></form>`;
  const l=db.items.filter(i=>enMes(i)&&i.estado===S.tab).sort((a,b)=>b.id-a.id);
  return h+(l.length?l.map(i=>itemCard(i,"jefe")).join(""):`<div class="empty">No hay incentivos ${S.tab==="pendiente"?"pendientes por revisar":S.tab+"s"}.</div>`);
}
function viewAli(){
  const a=S.user.name;
  const vis=db.items.filter(i=>enMes(i)&&i.estado==="aprobado"&&forAli(i,a)&&(S.lin==="Todas"||linea(i.marca)===S.lin));
  let h=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>Mis incentivos de ${mesCorto(S.mes)}</h1><div class="tabs" style="margin:0">${["Todas","Terminales","Tecnología"].map(x=>`<button class="tab" aria-selected="${S.lin===x}" data-lin="${x}">${x}</button>`).join("")}</div></div>`;
  h+=tabs([["meta","Meta volante"],["dia","Días de marca"],["oferta","Ofertas"]]);
  const l=vis.filter(i=>i.tipo===S.tab).sort((x,y)=>S.tab==="dia"?x.d.fecha.localeCompare(y.d.fecha):0);
  if(S.tab==="meta"&&l.length){const tu=l.reduce((s,i)=>s+mU(i.d.metas[a]),0),tm=l.reduce((s,i)=>s+mM(i.d.metas[a]),0);
    h+=`<div class="card pn"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><span class="mut">Todas mis metas volantes (unidades y millones se suman por separado)</span><div class="row" style="gap:24px">${tu?`<div class="big">${num(tu)} <span style="font-size:18px">und</span></div>`:""}${tm?`<div class="big">$${num(tm)} <span style="font-size:18px">millones</span></div>`:""}</div></div><span class="mut">${l.length} marca${l.length>1?"s":""} aprobada${l.length>1?"s":""}</span></div><table class="stack" style="margin-top:12px"><thead><tr><th>Marca</th><th>Línea</th><th class="n">Unidades</th><th class="n">Millones</th><th>Categoría</th><th>Vigencia</th></tr></thead><tbody>${l.map(i=>`<tr><td><span class="row" style="gap:8px">${logo(i.marca)}${nom(i.marca)}</span></td><td>${linea(i.marca)}</td><td class="n">${mU(i.d.metas[a])?num(mU(i.d.metas[a])):""}</td><td class="n">${mM(i.d.metas[a])?"$"+num(mM(i.d.metas[a]))+" M":""}</td><td>${esc(i.d.metas[a].cat)}</td><td>${fdate(i.d.desde)} – ${fdate(i.d.hasta)}</td></tr>`).join("")}</tbody></table><p class="note">Abajo está el detalle de pagos de cada marca. Solo aparecen las metas ya aprobadas por el jefe de canal.</p></div>`}
  if(S.tab==="dia")h+=`<div class="card"><h3 style="margin-bottom:10px">Calendario de días de marca</h3>${calendar()}</div>`;
  h+=l.length?l.map(i=>itemCard(i,"ali")).join(""):`<div class="empty">No tienes ${TIPOS[S.tab].toLowerCase()} aprobadas${S.lin!=="Todas"?" en "+S.lin:""} por ahora.</div>`;
  return h;
}
function viewLogin(){
  const opt=(g,arr,f)=>`<optgroup label="${g}">${arr.map(x=>`<option value="${f}|${esc(x)}">${f==="brand"?nom(x):esc(x)}</option>`).join("")}</optgroup>`;
  return`<div class="top"><b>Incentivos TYT</b><span>Metas volantes · Días de marca · Ofertas</span></div><div class="wrap"><form class="card login" id="flog"><h1 style="margin-bottom:6px">Ingresar</h1><p class="mut" style="margin-top:0">Cada marca ve solo lo suyo, los jefes de canal aprueban y cada aliado ve únicamente sus incentivos aprobados.</p><label for="u">Usuario</label><select id="u">${opt("Marcas",MARCAS,"brand")}${opt("Jefes de canal",JEFES,"jefe")}${opt("Aliados",ALIADOS,"ali")}</select><label for="pw" style="margin-top:12px">Contraseña</label><input id="pw" type="password" autocomplete="current-password" placeholder="Tu contraseña"><button class="btn" style="width:100%;margin-top:16px">Entrar</button><p class="note">La contraseña inicial es 1234; cámbiala al entrar con el botón Contraseña. Si la olvidas, un jefe de canal puede restablecerla. Los incentivos precargados son datos de ejemplo.</p><div class="row" style="margin-top:10px"><button type="button" class="btn sec sm" data-act="reset">Restablecer datos de ejemplo</button><a class="btn sec sm" style="text-decoration:none;display:inline-flex;align-items:center" href="presentacion.pdf" target="_blank" rel="noopener">Ver presentación (PDF)</a></div></form></div>`;
}
function pwPanel(){
  if(S.pw)return`<form class="card pn" id="fpw"><h2>Cambiar contraseña</h2><div class="grid" style="margin-top:10px"><div><label for="p0">Contraseña actual</label><input id="p0" type="password" autocomplete="current-password" required></div><div><label for="p1">Nueva contraseña</label><input id="p1" type="password" autocomplete="new-password" minlength="6" required></div><div><label for="p2">Repite la nueva</label><input id="p2" type="password" autocomplete="new-password" minlength="6" required></div></div><p class="note">Mínimo 6 caracteres.</p><div class="row" style="margin-top:12px"><button class="btn">Guardar contraseña</button><button type="button" class="btn sec" data-act="pw-x">Cancelar</button></div></form>`;
  if(!db.pw[ukey()])return`<div class="card row" style="justify-content:space-between;background:var(--am);border-color:transparent"><span style="color:var(--ami);font-weight:600">Estás usando la contraseña inicial 1234. Cámbiala por una propia.</span><button class="btn sm" data-act="pw">Cambiar ahora</button></div>`;
  return"";
}
function mesBar(){return`<div class="mesbar"><label for="mes">Mes</label><select id="mes">${meses().map(m=>`<option value="${m}"${m===S.mes?" selected":""}>${mesLabel(m)}${m===hoyMes()?" (actual)":""}${m<hoyMes()?" · cerrado":""}</option>`).join("")}</select></div>`}
function render(){
  if(!S.mes)S.mes=defMes();
  if(!S.user){app.innerHTML=viewLogin();return}
  const r={brand:"Marca",jefe:"Jefe de canal",ali:"Aliado"}[S.user.role];
  const n=S.user.role==="brand"?nom(S.user.name):S.user.name;
  app.innerHTML=`<div class="top"><b>Incentivos TYT</b><div class="who"><span>${r}: <b>${esc(n)}</b></span><button class="btn sm" data-act="pw">Contraseña</button><button class="btn sm" data-act="out">Salir</button></div></div><div class="wrap">${mesBar()}${pwPanel()}${S.user.role==="brand"?viewBrand():S.user.role==="jefe"?viewJefe():viewAli()}</div>`;
}
const readPays=()=>[...document.querySelectorAll("#pays tbody tr")].map(tr=>({ref:tr.querySelector("[name=ref]").value.trim(),ali:+tr.querySelector("[name=ali]").value||0,staff:+tr.querySelector("[name=staff]").value||0,ase:+tr.querySelector("[name=ase]").value||0})).filter(r=>r.ref);
const readAlis=()=>document.getElementById("todos").checked?"todos":[...document.querySelectorAll("#alis input:checked")].map(i=>i.value);
const v=id=>document.getElementById(id).value;

app.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="flog"){if(!(await checkPw(v("u"),v("pw")))){toast("Contraseña incorrecta");return}const[role,name]=v("u").split("|");S.pw=false;S.user={role,name};S.tab=null;S.dia=null;S.lin="Todas";render();window.scrollTo(0,0);return}
  if(f.id==="fpw"){if(!(await checkPw(ukey(),v("p0")))){toast("La contraseña actual no es correcta");return}if(v("p1").length<6){toast("Mínimo 6 caracteres");return}if(v("p1")!==v("p2")){toast("Las contraseñas nuevas no coinciden");return}if(v("p1")==="1234"){toast("Usa una contraseña distinta a 1234");return}db.pw[ukey()]=await hash(v("p1"));save();S.pw=false;render();toast("Contraseña actualizada");return}
  if(f.id==="frst"){const k=v("ru");delete db.pw[k];save();render();toast("Contraseña restablecida a 1234");return}
  if(f.id==="fcal"){const k=v("cd"),m=v("cm");if(!k)return;if(m)db.cal[k]=m;else delete db.cal[k];save();render();toast(m?`${fdate(k)} asignado a ${nom(m)}`:`${fdate(k)} quedó libre`);return}
  if(f.id==="f"){
    const pagos=readPays();if(!pagos.length){toast("Agrega al menos una referencia con su pago");return}
    let d={pagos,cond:v("cond").trim()};
    if(S.tab==="meta"){const metas={};ALIADOS.forEach((a,i)=>metas[a]={und:parseFloat(document.querySelector(`[data-u="${i}"]`).value)||0,mill:parseFloat(document.querySelector(`[data-m="${i}"]`).value)||0,cat:document.querySelector(`[data-cat="${i}"]`).value});
      if(!Object.values(metas).some(hasM)){toast("Asigna meta al menos a un aliado");return}
      Object.assign(d,{objU:parseFloat(v("obju"))||0,objM:parseFloat(v("objm"))||0,desde:v("d1"),hasta:v("d2"),metas})}
    else{const al=readAlis();if(al!=="todos"&&!al.length){toast("Elige al menos un aliado");return}
      Object.assign(d,{titulo:v("tit").trim(),aliados:al},S.tab==="dia"?{fecha:v("fecha")}:{desde:v("d1"),hasta:v("d2")})}
    db.items.push({id:db.next++,marca:S.user.name,tipo:S.tab,estado:"pendiente",d});save();render();toast("Enviado. Queda pendiente de aprobación.");
  }
});
app.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-lin],[data-act],[data-day]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.rej=null;render();return}
  if(t.dataset.day){S.dia=t.dataset.day;render();return}
  if(t.dataset.lin){S.lin=t.dataset.lin;render();return}
  const a=t.dataset.act,id=+t.dataset.id,it=db.items.find(i=>i.id===id);
  if(a==="out"){S.user=null;S.pw=false;render()}
  else if(a==="pw"){S.pw=true;render();window.scrollTo(0,0);document.getElementById("p0")?.focus()}
  else if(a==="pw-x"){S.pw=false;render()}
  else if(a==="reset"){const pw=db.pw;db=seed();db.pw=pw;save();toast("Datos de ejemplo restablecidos")}
  else if(a==="addrow")document.querySelector("#pays tbody").insertAdjacentHTML("beforeend",payRow());
  else if(a==="delrow"){const rows=document.querySelectorAll("#pays tbody tr");if(rows.length>1)t.closest("tr").remove()}
  else if(a==="ok"){it.estado="aprobado";it.por=S.user.name;it.coment="";save();render();toast(`${nom(it.marca)} aprobado y publicado para los aliados`)}
  else if(a==="rej"){S.rej=id;render();document.getElementById("rc")?.focus()}
  else if(a==="rej-x"){S.rej=null;render()}
  else if(a==="rej-ok"){it.estado="rechazado";it.por=S.user.name;it.coment=v("rc").trim()||"Sin comentario";S.rej=null;save();render();toast("Rechazado. La marca verá el comentario.")}
});
app.addEventListener("change",e=>{
  if(e.target.id==="mes"){S.mes=e.target.value;S.dia=null;S.rej=null;render();return}

  if(e.target.id==="logoin"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);db.logos[S.user.name]=c.toDataURL("image/png");save();render();toast("Logo actualizado")};im.onerror=()=>toast("No se pudo leer la imagen");im.src=r.result};r.readAsDataURL(f);return}if(e.target.id==="todos")document.getElementById("alis").hidden=e.target.checked});
render();
}
</script>
</body>
