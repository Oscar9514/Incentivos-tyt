<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incentivos TYT</title>
<meta name="description" content="Plataforma de incentivos TYT: metas volantes, días de marca y ofertas específicas.">
<meta name="theme-color" content="#DA291C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23DA291C%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2232%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3ETYT%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: operativo, claro, de oficina comercial; nada decorativo.
   IDEA: tablero de incentivos tipo planilla oficial de liquidación.
   PICTURE: la herramienta misma (formularios, cola de aprobación, metas del aliado).
   COLOUR and TYPE: rojo corporativo #DA291C, blanco, gris claro, negro; Schibsted Grotesk.
   LAYOUT: barra esmeralda arriba, pestañas, una columna de tarjetas; tablas apiladas en móvil. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#141414);--ink:light-dark(#1a1a1a,#f2f2f2);--mut:light-dark(#5f5f5f,#b0b0b0);--em:#DA291C;--emd:light-dark(#b51f14,#ff6a5c);--pk:light-dark(#fde3e1,#4a1a16);--pki:light-dark(#9e1b12,#ffc9c4);--ln:light-dark(#e3e3e3,#333);--pn:light-dark(#f5f5f5,#1f1f1f);--ok:light-dark(#e3f3e8,#12331f);--oki:light-dark(#1b6b38,#8fdcaa);--am:light-dark(#fff1c9,#3d3210);--ami:light-dark(#6b5000,#ffe08a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(24px,5vw,34px);font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:700}
.top{background:var(--em);color:#fff;padding:14px max(4vw,16px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .who{margin-left:auto;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top b{font-weight:800}
.wrap{max-width:1000px;margin:0 auto;padding:20px max(4vw,16px) 60px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px}
.tab{flex:none;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 16px;font:600 15px/1 inherit;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{border:1.5px solid var(--ln);border-radius:14px;padding:16px;margin:0 0 14px;background:var(--bg)}
.card.pn{background:var(--pn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;font:16px inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--em);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:12px 18px;font:700 15px/1 inherit;cursor:pointer;min-height:44px;background:var(--em);color:#fff}
.btn.sec{background:var(--pn);color:var(--ink);border:1.5px solid var(--ln)}
.btn.no{background:var(--pk);color:var(--pki)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.top .btn{background:#fff;color:#b51f14}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.p-pendiente{background:var(--am);color:var(--ami)}.p-aprobado{background:var(--ok);color:var(--oki)}.p-rechazado{background:var(--pk);color:var(--pki)}
.tag{display:inline-block;border:1.5px solid var(--ln);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;padding:6px 6px;border-bottom:1.5px solid var(--ln)}
td{padding:7px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td input,td select{min-height:40px;padding:7px 9px}
.big{font-size:clamp(30px,7vw,44px);font-weight:800;line-height:1}
.mut{color:var(--mut);font-size:14px}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:10px 0}
.hero div{background:var(--pn);border-radius:10px;padding:12px}
.hero b{display:block;font-size:24px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;color:var(--mut);text-align:center;font-weight:600}
.cal .d{border:1px solid var(--ln);border-radius:8px;min-height:62px;padding:4px;font-size:12px}
.cal .d.on{background:var(--em);color:#fff;border-color:var(--em)}
.cal .d span{display:block;font-weight:800;font-size:11px;overflow-wrap:anywhere;line-height:1.1;margin-top:3px}
.login{max-width:440px;margin:6vh auto 0}
.mesbar{display:flex;align-items:center;gap:10px;margin:0 0 16px}.mesbar label{margin:0;color:var(--ink);font-size:15px}.mesbar select{width:auto;min-width:220px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}.day{border:2px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font:inherit;min-height:44px}.day b{display:block;font-size:17px}.day b::first-letter{text-transform:uppercase}.day span{font-size:13px;color:var(--mut)}.day.on{border-color:var(--em);background:var(--pk)}.day.on span{color:var(--pki)}
.logo{width:36px;height:36px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--ln);display:inline-grid;place-items:center;font-weight:800;font-size:13px;color:#DA291C;flex:none}.logo.lg{width:56px;height:56px;font-size:18px}
.empty{padding:22px;text-align:center;color:var(--mut);border:1.5px dashed var(--ln);border-radius:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:var(--ink);margin:0}
.chk input{width:20px;height:20px;min-height:0}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:6px;margin-top:6px}
.scroll{overflow-x:auto}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--ln)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}.cal .d{min-height:48px}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged,updatePassword,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDxTovSKRV_OYWzMlMRPJCpNB61CdNhjiY",authDomain:"incentivos-tyt.firebaseapp.com",projectId:"incentivos-tyt",storageBucket:"incentivos-tyt.firebasestorage.app",messagingSenderId:"776716313443",appId:"1:776716313443:web:824ee7fd2298f9f3d96956"};
const fa=initializeApp(firebaseConfig),auth=getAuth(fa),fs=getFirestore(fa);
let secA=null;const secAuth=()=>secA||(secA=getAuth(initializeApp(firebaseConfig,"crear-usuarios")));

const ALIADOS=["ALTYCOM BARRANQUILLA","CONEXIONES DIGITALES","CONEXIONES DIGITALES BARRANQUILLA","CONTACTMASTER BPO MANIZALES","COS BARRANQUILLA","GNP CALI","VOICETECH MEDELLIN","BENTOINT","COS BOGOTA","ONE CONTACT BOGOTA","VECTOR BOGOTA","ASISTE ING","GNP","ARCOS BOGOTA","ATENTO BOGOTA"];
const MARCAS=["HONOR","HUAWEI","KALLEY","MOTOROLA","OPPO","SAMSUNG","TCL","TECNO","VIVO","XIAOMI","ZTE","TECNOLOGIA"];
const JEFES=["Gina Bermúdez","César"];
const DOM="incentivos-tyt.app";
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const JEFE_EMAIL={"Gina Bermúdez":"j.gina@"+DOM,"César":"j.cesar@"+DOM};
const MS=Object.fromEntries(MARCAS.map(m=>[slug(m),m])),AS=Object.fromEntries(ALIADOS.map(a=>[slug(a),a]));
const emailOf=(r,n)=>r==="brand"?`m.${slug(n)}@${DOM}`:r==="ali"?`a.${slug(n)}@${DOM}`:r==="jefe"?JEFE_EMAIL[n]:`${n}@asesor.${DOM}`;
function userFromEmail(em){
  em=(em||"").toLowerCase();
  if(em.endsWith("@asesor."+DOM))return{role:"ase",name:em.split("@")[0]};
  const j=Object.entries(JEFE_EMAIL).find(([,e])=>e===em);if(j)return{role:"jefe",name:j[0]};
  if(!em.endsWith("@"+DOM))return null;
  const l=em.split("@")[0];
  if(l.startsWith("m.")&&MS[l.slice(2)])return{role:"brand",name:MS[l.slice(2)]};
  if(l.startsWith("a.")&&AS[l.slice(2)])return{role:"ali",name:AS[l.slice(2)]};
  return null;
}

const TIPOS={meta:"Meta volante",dia:"Día de marca",oferta:"Oferta específica"};
const linea=m=>m==="TECNOLOGIA"?"Tecnología":"Terminales";
const nom=m=>m==="TECNOLOGIA"?"Tecnología":m[0]+m.slice(1).toLowerCase();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>v?"$"+Number(v).toLocaleString("es-CO"):"—";
const num=v=>Number(v||0).toLocaleString("es-CO",{maximumFractionDigits:2});
const ub=(u,m)=>[u?num(u)+" und":"",m?"$"+num(m)+" M":""].filter(Boolean).join(" · ")||"—";
const mU=m=>Number(m?.und||0),mM=m=>Number(m?.mill||0),hasM=m=>m&&(mU(m)>0||mM(m)>0);
const fdate=s=>{if(!s)return"";const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CO",{weekday:"short",day:"numeric",month:"short"})};
const mesOf=it=>(it.tipo==="dia"?it.d.fecha:it.d.desde||"").slice(0,7);
const mesLabel=k=>{const[y,m]=k.split("-").map(Number);const t=new Date(y,m-1,1).toLocaleDateString("es-CO",{month:"long",year:"numeric"});return t[0].toUpperCase()+t.slice(1)};
const mesCorto=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("es-CO",{month:"long"})};
const lastDay=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const hoyMes=()=>ym(new Date());
const hoyISO=()=>{const t=new Date();return ym(t)+"-"+String(t.getDate()).padStart(2,"0")};
const meses=()=>{const t=new Date(),o=[];for(let i=1;i>=-12;i--)o.push(ym(new Date(t.getFullYear(),t.getMonth()+i,1)));return o};
const ts=i=>i.creado?.seconds??9e12;

const db={items:[],cal:{},logos:{},asesores:{},perfil:null,me:null};
const S={user:null,tab:null,lin:"Todas",rej:null,dia:null,mes:hoyMes(),login:"std",pw:false,busy:false,creados:null,registering:false};
const enMes=it=>it.mes===S.mes;
const app=document.getElementById("app");
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200)};
const ERR={"permission-denied":"No tienes permiso para esta acción.","auth/invalid-credential":"Usuario o contraseña incorrecta.","auth/wrong-password":"Usuario o contraseña incorrecta.","auth/user-not-found":"Usuario o contraseña incorrecta.","auth/invalid-login-credentials":"Usuario o contraseña incorrecta.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos e inténtalo de nuevo.","auth/network-request-failed":"Sin conexión con el servidor. Revisa tu internet.","unavailable":"Sin conexión con el servidor. Revisa tu internet.","auth/email-already-in-use":"Esta cédula ya está registrada. Ingresa con tu contraseña.","auth/weak-password":"La contraseña debe tener mínimo 6 caracteres.","auth/requires-recent-login":"Por seguridad, sal y vuelve a entrar antes de cambiar la contraseña."};
const errMsg=e=>ERR[e?.code]||("Error: "+(e?.code||e?.message||e));
async function act(fn,ok){if(S.busy)return;S.busy=true;try{await fn();if(ok)toast(ok)}catch(e){console.error(e);toast(errMsg(e))}finally{S.busy=false}}

/* ---------- datos ---------- */
async function loadCommon(){
  const[c,l]=await Promise.all([getDocs(collection(fs,"cal")),getDocs(collection(fs,"logos"))]);
  db.cal={};c.forEach(d=>db.cal[d.id]=d.data().marca);
  db.logos={};l.forEach(d=>{if(MS[d.id])db.logos[MS[d.id]]=d.data().data});
}
async function loadMonth(){
  const r=S.user.role;let q;
  if(r==="jefe")q=query(collection(fs,"items"),where("mes","==",S.mes));
  else if(r==="brand")q=query(collection(fs,"items"),where("ms","==",slug(S.user.name)),where("mes","==",S.mes));
  else if(r==="ali")q=query(collection(fs,"pub_ali"),where("as","==",slug(S.user.name)),where("mes","==",S.mes));
  else{if(!db.me){db.items=[];return}q=query(collection(fs,"pub_ase"),where("as","==",db.me.as),where("mes","==",S.mes))}
  const s=await getDocs(q);db.items=s.docs.map(d=>({id:d.id,...d.data()}));
  if(r==="ali"||r==="ase")db.items.forEach(i=>i.estado="aprobado");
  if(r==="jefe"){const a=await getDocs(collection(fs,"asesores"));db.asesores={};a.forEach(d=>db.asesores[d.id]=d.data())}
}
async function startSession(u){
  const usr=userFromEmail(u.email);
  if(!usr){await signOut(auth);toast("Este usuario no tiene un perfil en la plataforma.");return}
  S.user=usr;S.tab=null;S.dia=null;S.lin="Todas";S.pw=false;S.creados=null;
  app.innerHTML=`<div class="wrap"><div class="empty">Cargando…</div></div>`;
  try{
    const p=await getDoc(doc(fs,"perfil",u.uid));db.perfil=p.exists()?p.data():null;
    if(usr.role==="ase"){const m=await getDoc(doc(fs,"asesores",usr.name));db.me=m.exists()?m.data():null}else db.me=null;
    await loadCommon();await loadMonth();
  }catch(e){console.error(e);toast(errMsg(e))}
  render();window.scrollTo(0,0);
}
async function reload(){await loadCommon();await loadMonth();render()}

async function aprobar(it){
  const b=writeBatch(fs);
  b.update(doc(fs,"items",it.id),{estado:"aprobado",por:S.user.name,coment:""});
  const targets=it.tipo==="meta"?ALIADOS.filter(a=>hasM(it.d.metas?.[a])):(it.d.aliados==="todos"?ALIADOS:it.d.aliados);
  for(const a of targets){
    const as=slug(a),id=it.id+"_"+as,base={as,ms:it.ms,marca:it.marca,tipo:it.tipo,mes:it.mes,creado:serverTimestamp()};
    const dA={...it.d};if(it.tipo==="meta"){dA.metas={[a]:it.d.metas[a]};delete dA.objU;delete dA.objM}else dA.aliados=[a];
    b.set(doc(fs,"pub_ali",id),{...base,d:dA});
    const dS={titulo:it.d.titulo||"",fecha:it.d.fecha||"",desde:it.d.desde||"",hasta:it.d.hasta||"",cond:it.d.cond||"",pagos:(it.d.pagos||[]).filter(p=>p.ase>0).map(p=>({ref:p.ref,ase:p.ase})),metas:{[a]:{und:1,mill:0}},aliados:[a]};
    b.set(doc(fs,"pub_ase",id),{...base,d:dS});
  }
  await b.commit();
}
const genPw=()=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";return[...crypto.getRandomValues(new Uint32Array(10))].map(x=>c[x%c.length]).join("")};
async function crearUsuarios(){
  const list=[...JEFES.map(j=>["jefe",j]),...MARCAS.map(m=>["brand",m]),...ALIADOS.map(a=>["ali",a])].filter(([r,n])=>!(r==="jefe"&&n===S.user.name));
  const sa=secAuth(),out=[];S.creados={prog:0,total:list.length,rows:out};render();
  for(const[r,n]of list){
    const pw=genPw(),label=(r==="jefe"?"Jefe: ":r==="brand"?"Marca: ":"Aliado: ")+(r==="brand"?nom(n):n);
    try{await createUserWithEmailAndPassword(sa,emailOf(r,n),pw);out.push({label,pw});await signOut(sa)}
    catch(e){out.push({label,err:e.code==="auth/email-already-in-use"?"Ya existía (no se cambió)":errMsg(e)});if(e.code==="auth/too-many-requests")break}
    S.creados.prog++;render();await new Promise(z=>setTimeout(z,350));
  }
  S.creados.done=true;render();
}

/* ---------- vistas ---------- */
const logo=(m,big)=>db.logos[m]?`<img class="logo${big?" lg":""}" src="${db.logos[m]}" alt="Logo ${esc(nom(m))}">`:`<span class="logo${big?" lg":""}" aria-hidden="true">${esc(nom(m).slice(0,2).toUpperCase())}</span>`;
const forAli=(it,a)=>it.tipo==="meta"?hasM(it.d.metas?.[a]):(it.d.aliados==="todos"||(it.d.aliados||[]).includes(a));
function payTable(p,cols){const C={ali:"Pago aliado",staff:"Pago staff",ase:"Pago asesor"};return`<table class="stack"><thead><tr><th>Referencia</th>${cols.map(c=>`<th class="n">${C[c]}</th>`).join("")}</tr></thead><tbody>${p.map(r=>`<tr><td>${esc(r.ref)}</td>${cols.map(c=>`<td class="n">${money(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function detail(it,ali){
  const d=it.d;let h="";
  if(it.tipo==="meta"){
    if(ali){const m=d.metas[ali];h+=`<div class="hero"><div><span class="mut">Tu meta</span><b>${ub(mU(m),mM(m))}</b></div><div><span class="mut">Categoría</span><b>${esc(m.cat)}</b></div><div><span class="mut">Vigencia</span><b style="font-size:16px">${fdate(d.desde)} – ${fdate(d.hasta)}</b></div></div>`}
    else{const vs=Object.values(d.metas||{}),tu=vs.reduce((s,m)=>s+mU(m),0),tm=vs.reduce((s,m)=>s+mM(m),0);
      h+=`<div class="hero"><div><span class="mut">Objetivo total</span><b>${ub(d.objU,d.objM)}</b></div><div><span class="mut">Suma por aliado</span><b>${ub(tu,tm)}</b></div><div><span class="mut">Vigencia</span><b style="font-size:16px">${fdate(d.desde)} – ${fdate(d.hasta)}</b></div></div>`;
      const ent=ALIADOS.filter(a=>hasM(d.metas?.[a]));
      h+=`<details><summary>Meta por aliado (${ent.length})</summary><table class="stack"><thead><tr><th>Aliado</th><th class="n">Unidades</th><th class="n">Millones</th><th>Cat.</th></tr></thead><tbody>${ent.map(a=>{const m=d.metas[a];return`<tr><td>${esc(a)}</td><td class="n">${mU(m)?num(mU(m)):""}</td><td class="n">${mM(m)?"$"+num(mM(m))+" M":""}</td><td>${esc(m.cat)}</td></tr>`}).join("")}</tbody></table></details>`}

}
function pwPanel(){
  if(S.pw)return`<form class="card pn" id="fpw"><h2>Cambiar contraseña</h2><div class="grid" style="margin-top:10px"><div><label for="p0">Contraseña actual</label><input id="p0" type="password" autocomplete="current-password" required></div><div><label for="p1">Nueva contraseña</label><input id="p1" type="password" autocomplete="new-password" minlength="6" required></div><div><label for="p2">Repite la nueva</label><input id="p2" type="password" autocomplete="new-password" minlength="6" required></div></div><p class="note">Mínimo 6 caracteres.</p><div class="row" style="margin-top:12px"><button class="btn">Guardar contraseña</button><button type="button" class="btn sec" data-act="pw-x">Cancelar</button></div></form>`;
  if(!db.perfil?.cambiada)return`<div class="card row" style="justify-content:space-between;background:var(--am);border-color:transparent"><span style="color:var(--ami);font-weight:600">Estás usando la contraseña que te entregaron. Cámbiala por una propia.</span><button class="btn sm" data-act="pw">Cambiar ahora</button></div>`;
  return"";
}
const mesBar=()=>`<div class="mesbar"><label for="mes">Mes</label><select id="mes">${meses().map(m=>`<option value="${m}"${m===S.mes?" selected":""}>${mesLabel(m)}${m===hoyMes()?" (actual)":""}${m<hoyMes()?" · cerrado":""}</option>`).join("")}</select><button class="btn sec sm" data-act="reload">Actualizar</button></div>`;
function render(){
  if(!S.user){app.innerHTML=viewLogin();return}
  const r={brand:"Marca",jefe:"Jefe de canal",ali:"Aliado",ase:"Asesor"}[S.user.role];
  const n=S.user.role==="brand"?nom(S.user.name):S.user.role==="ase"?(db.me?db.me.nombre+" · "+db.me.aliado:S.user.name):S.user.name;
  app.innerHTML=`<div class="top"><b>Incentivos TYT</b><div class="who"><span>${r}: <b>${esc(n)}</b></span><button class="btn sm" data-act="pw">Contraseña</button><button class="btn sm" data-act="out">Salir</button></div></div><div class="wrap">${mesBar()}${pwPanel()}${S.user.role==="brand"?viewBrand():S.user.role==="jefe"?viewJefe():S.user.role==="ase"?viewAse():viewAli()}</div>`;
}

/* ---------- eventos ---------- */
const readPays=()=>[...document.querySelectorAll("#pays tbody tr")].map(tr=>({ref:tr.querySelector("[name=ref]").value.trim(),ali:+tr.querySelector("[name=ali]").value||0,staff:+tr.querySelector("[name=staff]").value||0,ase:+tr.querySelector("[name=ase]").value||0})).filter(r=>r.ref);
const readAlis=()=>document.getElementById("todos").checked?"todos":[...document.querySelectorAll("#alis input:checked")].map(i=>i.value);
const v=id=>document.getElementById(id).value;

app.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="flog"){const[r,n]=v("u").split("|");await act(()=>signInWithEmailAndPassword(auth,emailOf(r,n),v("pw")));return}
  if(f.id==="flogase"){const c=v("ced").replace(/\D/g,"");if(c.length<6){toast("Escribe tu cédula completa");return}await act(()=>signInWithEmailAndPassword(auth,emailOf("ase",c),v("pwa")));return}
  if(f.id==="freg"){const c=v("rced").replace(/\D/g,""),nm=v("rnom").trim(),al=v("rali");
    if(c.length<6||c.length>10){toast("La cédula debe tener entre 6 y 10 números");return}
    if(nm.length<5){toast("Escribe tu nombre completo");return}if(!al){toast("Elige tu aliado");return}
    if(v("rp1").length<6){toast("La contraseña debe tener mínimo 6 caracteres");return}if(v("rp1")!==v("rp2")){toast("Las contraseñas no coinciden");return}
    if(!document.getElementById("rok").checked){toast("Debes autorizar el tratamiento de datos");return}
    S.registering=true;
    await act(async()=>{
      const cr=await createUserWithEmailAndPassword(auth,emailOf("ase",c),v("rp1"));
      await setDoc(doc(fs,"asesores",c),{nombre:nm,aliado:al,as:slug(al),creado:hoyISO()});
      await setDoc(doc(fs,"perfil",cr.user.uid),{cambiada:true});
      S.registering=false;S.login="ase";await startSession(cr.user);
    },"¡Listo! Ya quedaste registrado");
    if(S.registering){S.registering=false;if(auth.currentUser&&!S.user)await startSession(auth.currentUser)}
    return}
  if(f.id==="fpw"){if(v("p1").length<6){toast("Mínimo 6 caracteres");return}if(v("p1")!==v("p2")){toast("Las contraseñas nuevas no coinciden");return}
    await act(async()=>{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,v("p0")));await updatePassword(u,v("p1"));await setDoc(doc(fs,"perfil",u.uid),{cambiada:true});db.perfil={cambiada:true};S.pw=false;render()},"Contraseña actualizada");return}
  if(f.id==="fcal"){const k=v("cd"),m=v("cm");if(!k)return;
    await act(async()=>{if(m)await setDoc(doc(fs,"cal",k),{marca:m});else await deleteDoc(doc(fs,"cal",k));if(m)db.cal[k]=m;else delete db.cal[k];render()},m?`${fdate(k)} asignado a ${nom(m)}`:`${fdate(k)} quedó libre`);return}
  if(f.id==="f"){
    const pagos=readPays();if(!pagos.length){toast("Agrega al menos una referencia con su pago");return}
    const d={pagos,cond:v("cond").trim()};
    if(S.tab==="meta"){const metas={};ALIADOS.forEach((a,i)=>{const m={und:parseFloat(document.querySelector(`[data-u="${i}"]`).value)||0,mill:parseFloat(document.querySelector(`[data-m="${i}"]`).value)||0,cat:document.querySelector(`[data-cat="${i}"]`).value};if(hasM(m))metas[a]=m});
      if(!Object.keys(metas).length){toast("Asigna meta al menos a un aliado");return}
      Object.assign(d,{objU:parseFloat(v("obju"))||0,objM:parseFloat(v("objm"))||0,desde:v("d1"),hasta:v("d2"),metas})}
    else{const al=readAlis();if(al!=="todos"&&!al.length){toast("Elige al menos un aliado");return}
      Object.assign(d,{titulo:v("tit").trim(),aliados:al},S.tab==="dia"?{fecha:v("fecha")}:{desde:v("d1"),hasta:v("d2")})}
    const it={ms:slug(S.user.name),marca:S.user.name,tipo:S.tab,estado:"pendiente",d,creado:serverTimestamp()};it.mes=mesOf(it);
    await act(async()=>{await addDoc(collection(fs,"items"),it);await loadMonth();render()},it.mes===S.mes?"Enviado. Queda pendiente de aprobación.":`Enviado a ${mesLabel(it.mes)}. Queda pendiente de aprobación.`);
  }
});
app.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-lin],[data-act],[data-day],[data-login]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.rej=null;render();return}
  if(t.dataset.login){S.login=t.dataset.login;render();return}
  if(t.dataset.day){S.dia=t.dataset.day;render();return}
  if(t.dataset.lin){S.lin=t.dataset.lin;render();return}
  const a=t.dataset.act,id=t.dataset.id,it=db.items.find(i=>i.id===id);
  if(a==="out")await signOut(auth);
  else if(a==="pw"){S.pw=true;render();window.scrollTo(0,0);document.getElementById("p0")?.focus()}
  else if(a==="pw-x"){S.pw=false;render()}
  else if(a==="reload")await act(reload,"Datos actualizados");
  else if(a==="addrow")document.querySelector("#pays tbody").insertAdjacentHTML("beforeend",payRow());
  else if(a==="delrow"){if(document.querySelectorAll("#pays tbody tr").length>1)t.closest("tr").remove()}
  else if(a==="ok"&&it)await act(async()=>{await aprobar(it);it.estado="aprobado";it.por=S.user.name;it.coment="";render()},`${nom(it.marca)} aprobado y publicado`);
  else if(a==="rej"){S.rej=id;render();document.getElementById("rc")?.focus()}
  else if(a==="rej-x"){S.rej=null;render()}
  else if(a==="rej-ok"&&it){const c=v("rc").trim()||"Sin comentario";await act(async()=>{await updateDoc(doc(fs,"items",id),{estado:"rechazado",por:S.user.name,coment:c});it.estado="rechazado";it.por=S.user.name;it.coment=c;S.rej=null;render()},"Rechazado. La marca verá el comentario.")}
  else if(a==="crear"){if(S.creados&&!S.creados.done)return;try{await crearUsuarios()}catch(e){console.error(e);toast(errMsg(e))}}
  else if(a==="copiar"){const txt=S.creados.rows.filter(r=>r.pw).map(r=>`${r.label}: ${r.pw}`).join("\n");try{await navigator.clipboard.writeText(txt);toast("Lista copiada")}catch(e){toast("No se pudo copiar. Selecciona la tabla y cópiala a mano.")}}
});
app.addEventListener("change",async e=>{
  if(e.target.id==="mes"){S.mes=e.target.value;S.dia=null;S.rej=null;await act(async()=>{await loadMonth();render()});return}
  if(e.target.id==="todos"){document.getElementById("alis").hidden=e.target.checked;return}
  if(e.target.id==="logoin"){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const data=c.toDataURL("image/png");act(async()=>{await setDoc(doc(fs,"logos",slug(S.user.name)),{data});db.logos[S.user.name]=data;render()},"Logo actualizado")};im.onerror=()=>toast("No se pudo leer la imagen");im.src=r.result};r.readAsDataURL(file)}
});

app.innerHTML=`<div class="wrap"><div class="empty">Cargando…</div></div>`;
onAuthStateChanged(auth,async u=>{
  if(S.registering)return;
  if(!u){S.user=null;db.items=[];db.me=null;db.perfil=null;render();return}
  await startSession(u);
});
</script>
</body>
</html>
