<style>
/* VOICE: operativo, claro, de oficina comercial; nada decorativo.
   IDEA: tablero de incentivos tipo planilla oficial de liquidación.
   PICTURE: la herramienta misma (formularios, cola de aprobación, metas del aliado).
   COLOUR and TYPE: rojo corporativo #DA291C, blanco, gris claro, negro; Schibsted Grotesk.
   LAYOUT: barra esmeralda arriba, pestañas, una columna de tarjetas; tablas apiladas en móvil. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#141414);--ink:light-dark(#1a1a1a,#f2f2f2);--mut:light-dark(#5f5f5f,#b0b0b0);--em:#DA291C;--emd:light-dark(#b51f14,#ff6a5c);--pk:light-dark(#fde3e1,#4a1a16);--pki:light-dark(#9e1b12,#ffc9c4);--ln:light-dark(#e3e3e3,#333);--pn:light-dark(#f5f5f5,#1f1f1f);--ok:light-dark(#e3f3e8,#12331f);--oki:light-dark(#1b6b38,#8fdcaa);--am:light-dark(#fff1c9,#3d3210);--ami:light-dark(#6b5000,#ffe08a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(24px,5vw,34px);font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:700}
.top{background:var(--em);color:#fff;padding:14px max(4vw,16px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top .who{margin-left:auto;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top b{font-weight:800}
.wrap{max-width:1000px;margin:0 auto;padding:20px max(4vw,16px) 60px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px}
.tab{flex:none;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 16px;font:600 15px/1 inherit;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{border:1.5px solid var(--ln);border-radius:14px;padding:16px;margin:0 0 14px;background:var(--bg)}
.card.pn{background:var(--pn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}

textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--em);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:12px 18px;font:700 15px/1 inherit;cursor:pointer;min-height:44px;background:var(--em);color:#fff}
.btn.sec{background:var(--pn);color:var(--ink);border:1.5px solid var(--ln)}
.btn.no{background:var(--pk);color:var(--pki)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.top .btn{background:#fff;color:#b51f14}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.p-pendiente{background:var(--am);color:var(--ami)}.p-aprobado{background:var(--ok);color:var(--oki)}.p-rechazado{background:var(--pk);color:var(--pki)}
.tag{display:inline-block;border:1.5px solid var(--ln);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;padding:6px 6px;border-bottom:1.5px solid var(--ln)}
td{padding:7px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td input,td select{min-height:40px;padding:7px 9px}
.big{font-size:clamp(30px,7vw,44px);font-weight:800;line-height:1}
.mut{color:var(--mut);font-size:14px}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:10px 0}
.hero div{background:var(--pn);border-radius:10px;padding:12px}
.hero b{display:block;font-size:24px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;color:var(--mut);text-align:center;font-weight:600}
.cal .d{border:1px solid var(--ln);border-radius:8px;min-height:62px;padding:4px;font-size:12px}
.cal button.d{font:inherit;font-size:12px;text-align:left;background:var(--bg);color:var(--ink);cursor:pointer;display:block;width:100%}.cal .d.on{background:var(--em);color:#fff;border-color:var(--em)}.cal .d.sel{outline:3px solid var(--ink);outline-offset:1px}
.cal .d span{display:block;font-weight:800;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;margin-top:2px}
.login{max-width:440px;margin:6vh auto 0}
.ofimg{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:10px;margin:10px 0;background:var(--pn)}
.mesbar{display:flex;align-items:center;gap:10px;margin:0 0 16px}.mesbar label{margin:0;color:var(--ink);font-size:15px}.mesbar select{width:auto;min-width:220px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}.day{border:2px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font:inherit;min-height:44px}.day b{display:block;font-size:17px}.day b::first-letter{text-transform:uppercase}.day span{font-size:13px;color:var(--mut)}.day.on{border-color:var(--em);background:var(--pk)}.day.on span{color:var(--pki)}
.logo{width:36px;height:36px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--ln);display:inline-grid;place-items:center;font-weight:800;font-size:13px;color:#DA291C;flex:none}.logo.lg{width:56px;height:56px;font-size:18px}
.empty{padding:22px;text-align:center;color:var(--mut);border:1.5px dashed var(--ln);border-radius:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:var(--ink);margin:0}
.chk input{width:20px;height:20px;min-height:0}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:6px;margin-top:6px}
.scroll{overflow-x:auto}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--ln)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}.cal .d{min-height:48px}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged,updatePassword,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDxTovSKRV_OYWzMlMRPJCpNB61CdNhjiY",authDomain:"incentivos-tyt.firebaseapp.com",projectId:"incentivos-tyt",storageBucket:"incentivos-tyt.firebasestorage.app",messagingSenderId:"776716313443",appId:"1:776716313443:web:824ee7fd2298f9f3d96956"};
const fa=initializeApp(firebaseConfig),auth=getAuth(fa),fs=getFirestore(fa);
let secA=null;const secAuth=()=>secA||(secA=getAuth(initializeApp(firebaseConfig,"crear-usuarios")));

const ALIADOS=["ALTYCOM BARRANQUILLA","CONEXIONES DIGITALES","CONEXIONES DIGITALES BARRANQUILLA","CONTACTMASTER BPO MANIZALES","COS BARRANQUILLA","GNP CALI","VOICETECH MEDELLIN","BENTOINT","COS BOGOTA","ONE CONTACT BOGOTA","VECTOR BOGOTA","ASISTE ING","GNP","ARCOS BOGOTA","ATENTO BOGOTA"];
const MARCAS=["HONOR","HUAWEI","KALLEY","MOTOROLA","OPPO","SAMSUNG","TCL","TECNO","VIVO","XIAOMI","ZTE","TECNOLOGIA"];
const JEFES=["Gina Bermúdez","César"];
const ESPS=["CORREA RAMIREZ OSCAR IVAN","VARGAS MARTINEZ JORGE ANDRES","VELASQUEZ MORENO JOHN FERNANDO","MARTINEZ POVEDA CARLOS ANDRES","ZAPATA GONZALEZ VLADIMIR"];
const DOM="incentivos-tyt.app";
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const JEFE_EMAIL={"Gina Bermúdez":"j.gina@"+DOM,"César":"j.cesar@"+DOM};
const MS=Object.fromEntries(MARCAS.map(m=>[slug(m),m])),AS=Object.fromEntries(ALIADOS.map(a=>[slug(a),a])),ES=Object.fromEntries(ESPS.map(e=>[slug(e),e]));
const emailOf=(r,n)=>r==="brand"?`m.${slug(n)}@${DOM}`:r==="ali"?`a.${slug(n)}@${DOM}`:r==="esp"?`e.${slug(n)}@${DOM}`:JEFE_EMAIL[n];
function userFromEmail(em){
  em=(em||"").toLowerCase();
  const j=Object.entries(JEFE_EMAIL).find(([,e])=>e===em);if(j)return{role:"jefe",name:j[0]};
  if(!em.endsWith("@"+DOM))return null;
  const l=em.split("@")[0],k=l.slice(2);
  if(l.startsWith("m.")&&MS[k])return{role:"brand",name:MS[k]};
  if(l.startsWith("a.")&&AS[k])return{role:"ali",name:AS[k]};
  if(l.startsWith("e.")&&ES[k])return{role:"esp",name:ES[k]};
  return null;
}

const TIPOS={meta:"Meta volante",dia:"Día de marca",oferta:"Oferta específica"};
const PLUR={meta:"metas volantes",dia:"días de marca",oferta:"ofertas"};
const linea=m=>m==="TECNOLOGIA"?"Tecnología":"Terminales";
const nom=m=>m==="TECNOLOGIA"?"Tecnología":m[0]+m.slice(1).toLowerCase();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>v?"$"+Number(v).toLocaleString("es-CO"):"—";
const num=v=>Number(v||0).toLocaleString("es-CO",{maximumFractionDigits:2});
const ub=(u,m)=>[u?num(u)+" und":"",m?"$"+num(m)+" M":""].filter(Boolean).join(" · ")||"—";
const mU=m=>Number(m?.und||0),mM=m=>Number(m?.mill||0),hasM=m=>m&&(mU(m)>0||mM(m)>0);
const fdate=s=>{if(!s)return"";const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CO",{weekday:"short",day:"numeric",month:"short"})};
const mesOf=it=>(it.tipo==="dia"?it.d.fecha:it.d.desde||"").slice(0,7);
const mesLabel=k=>{const[y,m]=k.split("-").map(Number);const t=new Date(y,m-1,1).toLocaleDateString("es-CO",{month:"long",year:"numeric"});return t[0].toUpperCase()+t.slice(1)};
const mesCorto=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("es-CO",{month:"long"})};
const lastDay=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const hoyMes=()=>ym(new Date());
const MES0="2026-12";
const meses=()=>{const t=new Date(),fin=ym(new Date(t.getFullYear(),t.getMonth()+1,1)),o=[];let[y,m]=MES0.split("-").map(Number);for(let k=MES0;k<=fin;){o.push(k);m++;if(m>12){m=1;y++}k=y+"-"+String(m).padStart(2,"0")}return o.reverse()};
const mesInicial=()=>hoyMes()<MES0?MES0:hoyMes();
const ts=i=>i.creado?.seconds??9e12;
const onDay=(it,k)=>it.tipo==="dia"?it.d.fecha===k:it.tipo==="oferta"?(it.d.desde<=k&&k<=(it.d.hasta||it.d.desde)):false;
const sumMetas=d=>{const v=Object.values(d?.metas||{});return{u:v.reduce((s,m)=>s+mU(m),0),m:v.reduce((s,m)=>s+mM(m),0)}};

const db={imgs:{},items:[],cal:{},logos:{},perfil:null};
const S={user:null,tab:null,lin:"Todas",rej:null,dia:null,mes:mesInicial(),pw:false,busy:false,creados:null,fM:"",fD:"",fA:"",calDay:"",ofImg:"",ofImgId:"",edit:null};
const app=document.getElementById("app");
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200)};
const ERR={"permission-denied":"No tienes permiso para esta acción.","auth/invalid-credential":"Usuario o contraseña incorrecta.","auth/wrong-password":"Usuario o contraseña incorrecta.","auth/user-not-found":"Usuario o contraseña incorrecta.","auth/invalid-login-credentials":"Usuario o contraseña incorrecta.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos e inténtalo de nuevo.","auth/network-request-failed":"Sin conexión con el servidor. Revisa tu internet.","unavailable":"Sin conexión con el servidor. Revisa tu internet.","auth/weak-password":"La contraseña debe tener mínimo 6 caracteres.","auth/requires-recent-login":"Por seguridad, sal y vuelve a entrar antes de cambiar la contraseña."};
const errMsg=e=>ERR[e?.code]||("Error: "+(e?.code||e?.message||e));
async function act(fn,ok){if(S.busy)return;S.busy=true;try{await fn();if(ok)toast(ok)}catch(e){console.error(e);toast(errMsg(e))}finally{S.busy=false}}

/* ---------- datos ---------- */
async function loadCommon(){
  const[c,l]=await Promise.all([getDocs(collection(fs,"cal")),getDocs(collection(fs,"logos"))]);
  db.cal={};c.forEach(d=>{const x=d.data(),e=x.e||(x.marca?[{marca:x.marca,tec:""}]:[]);if(e.length)db.cal[d.id]=e});
  db.logos={};l.forEach(d=>{if(MS[d.id])db.logos[MS[d.id]]=d.data().data});
}
async function loadMonth(){
  const r=S.user.role;let q;
  if(r==="jefe"||r==="esp")q=query(collection(fs,"items"),where("mes","==",S.mes));
  else if(r==="brand")q=query(collection(fs,"items"),where("ms","==",slug(S.user.name)),where("mes","==",S.mes));
  else q=query(collection(fs,"pub_ali"),where("as","==",slug(S.user.name)),where("mes","==",S.mes));
  const s=await getDocs(q);db.items=s.docs.map(d=>({id:d.id,...d.data()}));
  if(r==="ali")db.items.forEach(i=>i.estado="aprobado");
  if(r==="esp")db.items=db.items.filter(i=>i.estado==="aprobado");
  const faltan=[...new Set(db.items.map(i=>i.d?.img).filter(x=>x&&!db.imgs[x]))];
  await Promise.all(faltan.map(async id=>{try{const g=await getDoc(doc(fs,"imgs",id));if(g.exists())db.imgs[id]=g.data().data}catch(e){console.warn(e)}}));
}
async function startSession(u){
  const usr=userFromEmail(u.email);
  if(!usr){await signOut(auth);toast("Este usuario no tiene un perfil en la plataforma.");return}
  Object.assign(S,{user:usr,tab:null,fM:"",fD:"",fA:"",calDay:"",dia:null,lin:"Todas",pw:false,creados:null,edit:null,ofImg:"",ofImgId:""});
  app.innerHTML=`<div class="wrap"><div class="empty">Cargando…</div></div>`;
  try{const p=await getDoc(doc(fs,"perfil",u.uid));db.perfil=p.exists()?p.data():null;await loadCommon();await loadMonth()}
  catch(e){console.error(e);toast(errMsg(e))}
  render();window.scrollTo(0,0);
}
async function reload(){await loadCommon();await loadMonth();render()}

async function aprobar(it){
  const b=writeBatch(fs);
  b.update(doc(fs,"items",it.id),{estado:"aprobado",por:S.user.name,coment:"",aprobadoEn:serverTimestamp()});
  const targets=it.tipo==="meta"?ALIADOS.filter(a=>hasM(it.d.metas?.[a])):(it.d.aliados==="todos"?ALIADOS:it.d.aliados);
  for(const a of targets){
    const as=slug(a),dA={...it.d},my=it.d.metas?.[a];
    dA.metas=hasM(my)?{[a]:my}:{};delete dA.objU;delete dA.objM;if(it.tipo!=="meta")dA.aliados=[a];
    b.set(doc(fs,"pub_ali",it.id+"_"+as),{as,ms:it.ms,marca:it.marca,tipo:it.tipo,mes:it.mes,creado:serverTimestamp(),aprobadoPor:S.user.name,d:dA});
  }
  await b.commit();
}
const genPw=()=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";return[...crypto.getRandomValues(new Uint32Array(10))].map(x=>c[x%c.length]).join("")};
async function crearUsuarios(){
  const list=[...JEFES.map(j=>["jefe",j]),...ESPS.map(e=>["esp",e]),...MARCAS.map(m=>["brand",m]),...ALIADOS.map(a=>["ali",a])].filter(([r,n])=>!(r==="jefe"&&n===S.user.name));
  const sa=secAuth(),out=[];S.creados={prog:0,total:list.length,rows:out};render();
  for(const[r,n]of list){
    const pw=genPw(),label=({jefe:"Jefe: ",esp:"Especialista: ",brand:"Marca: ",ali:"Aliado: "})[r]+(r==="brand"?nom(n):n);
    try{await createUserWithEmailAndPassword(sa,emailOf(r,n),pw);out.push({label,pw});await signOut(sa)}
    catch(e){out.push({label,err:e.code==="auth/email-already-in-use"?"Ya existía (no se cambió)":errMsg(e)});if(e.code==="auth/too-many-requests")break}
    S.creados.prog++;render();await new Promise(z=>setTimeout(z,350));
  }
  S.creados.done=true;render();
}
function achicar(file,max,lim){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{let w=im.width,h=im.height,k=Math.min(1,max/Math.max(w,h)),q=.8,data="";for(let i=0;i<6;i++){const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);data=c.toDataURL("image/jpeg",q);if(data.length<lim)return ok(data);q-=.1;k*=.85}ko(new Error("grande"))};im.src=r.result};r.readAsDataURL(file)})}

/* ---------- PDF ---------- */
const fechaHora=t=>t?.seconds?new Date(t.seconds*1000).toLocaleString("es-CO",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const pdfMetas=(d,solo)=>{const ent=ALIADOS.filter(a=>hasM(d.metas?.[a])&&(!solo||a===solo));if(!ent.length)return"";const t=sumMetas({metas:Object.fromEntries(ent.map(a=>[a,d.metas[a]]))});

  ${metas?`<h2>${it.tipo==="dia"?"Meta del día por aliado":"Meta por aliado"}</h2>${metas}`:""}<h2>Pago por referencia</h2>${pdfPagos(d.pagos)}${d.img&&db.imgs[d.img]?`<h2>Imagen</h2><img src="${db.imgs[d.img]}" alt="">`:""}<h2>Condiciones</h2><div class="cond">${esc(d.cond||"Sin condiciones registradas.")}</div><p class="k">Registro ${esc(it.id)}</p>`);
}
function abrirPDFAliado(a){

  const metas=by("meta"),dias=by("dia").sort((x,y)=>x.d.fecha.localeCompare(y.d.fecha)),ofs=by("oferta").sort((x,y)=>x.d.desde.localeCompare(y.d.desde));
  const tu=metas.reduce((s,i)=>s+mU(i.d.metas[a]),0),tm=metas.reduce((s,i)=>s+mM(i.d.metas[a]),0);
  const blk=i=>{const d=i.d;return`<div class="blk"><h3>${esc(nomIt(i))} · ${i.tipo==="meta"?"Meta volante":esc(d.titulo||"")}</h3><div class="k">${i.tipo==="dia"?fdate(d.fecha):fdate(d.desde)+" – "+fdate(d.hasta)} · Aprobado por ${esc(i.por||"")}</div>${pdfMetas(d,a)?`<p><b>${i.tipo==="dia"?"Meta del día":"Meta"}:</b></p>${pdfMetas(d,a)}`:""}<p><b>Pagos:</b></p>${pdfPagos(d.pagos)}${d.cond?`<p><b>Condiciones:</b></p><div class="cond">${esc(d.cond)}</div>`:""}</div>`};
  pdfOpen(`Incentivos ${a} ${mesLabel(S.mes)}`,`<header><div><div class="k">Plataforma de incentivos TYT</div><h1>${esc(a)}</h1><div class="k">Incentivos aprobados · ${esc(mesLabel(S.mes))}</div></div></header>
  <h2>Resumen de metas volantes</h2>${metas.length?`<table class="g"><thead><tr><th>Marca</th><th>Línea</th><th class="n">Unidades</th><th class="n">Millones</th><th>Categoría</th><th>Premio</th><th>Aprobado por</th></tr></thead><tbody>${metas.map(i=>{const m=i.d.metas[a];return`<tr><td>${esc(nomIt(i))}</td><td>${linea(i.marca)}</td><td class="n">${mU(m)?num(mU(m)):""}</td><td class="n">${mM(m)?"$"+num(mM(m))+" M":""}</td><td>${esc(m.cat)}</td><td>${esc(m.premio||"")}</td><td>${esc(i.por||"")}</td></tr>`}).join("")}</tbody><tfoot><tr><th colspan="2">Total</th><th class="n">${tu?num(tu):""}</th><th class="n">${tm?"$"+num(tm)+" M":""}</th><th colspan="3"></th></tr></tfoot></table>`:`<p class="k">No hay metas volantes aprobadas.</p>`}
  ${metas.length?`<h2>Detalle de metas volantes</h2>${metas.map(blk).join("")}`:""}<h2>Días de marca (${dias.length})</h2>${dias.length?dias.map(blk).join(""):`<p class="k">No hay días de marca aprobados.</p>`}<h2>Ofertas específicas (${ofs.length})</h2>${ofs.length?ofs.map(blk).join(""):`<p class="k">No hay ofertas aprobadas.</p>`}`);
}

const editHead=E=>E?`<div class="card" style="background:var(--am);border-color:transparent"><b style="color:var(--ami)">Estás corrigiendo un incentivo rechazado.</b>${E.coment?`<p class="note" style="color:var(--ami)">Motivo del rechazo: ${esc(E.coment)}</p>`:""}<button type="button" class="btn sec sm" data-act="editx" style="margin-top:8px">Cancelar corrección</button></div>`:"";

function brandForm(E){
  const m=S.user.name,d=E?.d||{};
  if(S.tab==="meta")return`${editHead(E)}<form class="card pn" id="f"><h2>${E?"Corregir meta volante":"Nueva meta volante de "+mesCorto(S.mes)}</h2><p class="mut">Formato único: meta, categoría y premio por aliado, pagos y condiciones.</p><div class="grid"><div><label for="d1">Desde</label><input id="d1" type="date" value="${d.desde||S.mes+"-01"}" required></div><div><label for="d2">Hasta</label><input id="d2" type="date" value="${d.hasta||S.mes+"-"+lastDay(S.mes)}" required></div></div>${metaFields(false,d.metas)}${payEditor(d.pagos,false)}<label for="cond" style="margin-top:16px">Condiciones (corte, fecha de pago, con o sin IVA)</label><textarea id="cond">${esc(d.cond||"")}</textarea>${sendBtn(E,"Enviar a aprobación")}</form>`;
  if(S.tab==="dia"){const days=myDays();
    if(E&&!days.includes(d.fecha))days.push(d.fecha);
    if(!days.length)return`<div class="empty">TYT todavía no te ha asignado días de marca en ${mesCorto(S.mes)}. Cuando el jefe de canal te asigne días, aparecerán aquí.</div>`;

    const editId=S.edit,E=editId?db.items.find(i=>i.id===editId):null;
    await act(async()=>{
      if(S.tab!=="meta"&&S.ofImg){if(S.ofImgId&&db.imgs[S.ofImgId]===S.ofImg)d.img=S.ofImgId;else{const ref=doc(collection(fs,"imgs"));await setDoc(ref,{ms:slug(S.user.name),data:S.ofImg});d.img=ref.id;db.imgs[ref.id]=S.ofImg}}
      if(E)await updateDoc(doc(fs,"items",editId),{estado:"pendiente",d,mes,coment:"",por:"",ultimoRechazo:E.coment||"",reenviado:serverTimestamp()});
      else await addDoc(collection(fs,"items"),{ms:slug(S.user.name),marca:S.user.name,tipo:S.tab,estado:"pendiente",d,mes,creado:serverTimestamp()});
      resetEdit();await loadMonth();render();window.scrollTo(0,0);
    },E?"Corregido y reenviado a aprobación.":mes===S.mes?"Enviado. Queda pendiente de aprobación.":`Enviado a ${mesLabel(mes)}. Queda pendiente de aprobación.`);
  }
});
app.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-lin],[data-act],[data-day],[data-cal]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.rej=null;resetEdit();render();return}
  if(t.dataset.day){S.dia=t.dataset.day;resetEdit();render();return}
  if(t.dataset.cal){S.calDay=S.calDay===t.dataset.cal?"":t.dataset.cal;render();if(S.calDay)document.querySelector(".cal")?.closest(".card")?.nextElementSibling?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.lin){S.lin=t.dataset.lin;render();return}
  const a=t.dataset.act,id=t.dataset.id,it=db.items.find(i=>i.id===id);
  if(a==="out")await signOut(auth);
  else if(a==="pw"){S.pw=true;render();window.scrollTo(0,0);document.getElementById("p0")?.focus()}
  else if(a==="pw-x"){S.pw=false;render()}
  else if(a==="reload")await act(reload,"Datos actualizados");
  else if(a==="addrow"){const tb=document.querySelector("#pays");tb.querySelector("tbody").insertAdjacentHTML("beforeend",payRow({},tb.dataset.pr==="1"))}
  else if(a==="delrow"){if(document.querySelectorAll("#pays tbody tr").length>1)t.closest("tr").remove()}
  else if(a==="ok"&&it)await act(async()=>{await aprobar(it);it.estado="aprobado";it.por=S.user.name;it.coment="";it.aprobadoEn={seconds:Math.floor(Date.now()/1000)};render()},`${nom(it.marca)} aprobado y publicado`);
  else if(a==="rej"){S.rej=id;render();document.getElementById("rc")?.focus()}
  else if(a==="rej-x"){S.rej=null;render()}
  else if(a==="rej-ok"&&it){const c=v("rc").trim()||"Sin comentario";await act(async()=>{await updateDoc(doc(fs,"items",id),{estado:"rechazado",por:S.user.name,coment:c});it.estado="rechazado";it.por=S.user.name;it.coment=c;S.rej=null;render()},"Rechazado. La marca verá el comentario y podrá corregirlo.")}
  else if(a==="edit"&&it){S.edit=it.id;S.tab=it.tipo;if(it.tipo==="dia")S.dia=it.d.fecha;S.ofImgId=it.d.img||"";S.ofImg=it.d.img?db.imgs[it.d.img]||"":"";render();document.getElementById("f")?.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="editx"){resetEdit();render()}
  else if(a==="pdf"&&it)abrirPDF(it);
  else if(a==="pdfali"&&S.fA)abrirPDFAliado(S.fA);
  else if(a==="ofimgx"){S.ofImg="";document.getElementById("ofprev").innerHTML="";const l=document.getElementById("ofimgin")?.closest("label");if(l)l.firstChild.textContent="Subir imagen"}
  else if(a==="calclear"){S.calDay="";render()}
  else if(a==="filclear"){S.fM="";S.fD="";render()}
  else if(a==="calrm"){const k=t.dataset.k,i=+t.dataset.i,ent=(db.cal[k]||[]).filter((_,j)=>j!==i);await act(async()=>{if(ent.length)await setDoc(doc(fs,"cal",k),{e:ent});else await deleteDoc(doc(fs,"cal",k));if(ent.length)db.cal[k]=ent;else delete db.cal[k];render()},"Marca quitada de ese día")}
  else if(a==="crear"){if(S.creados&&!S.creados.done)return;try{await crearUsuarios()}catch(e){console.error(e);toast(errMsg(e))}}
  else if(a==="copiar"){const txt=S.creados.rows.filter(r=>r.pw).map(r=>`${r.label}: ${r.pw}`).join("\n");try{await navigator.clipboard.writeText(txt);toast("Lista copiada")}catch(e){toast("No se pudo copiar. Selecciona la tabla y cópiala a mano.")}}
});
app.addEventListener("input",e=>{
  const x=e.target;if(!(x.dataset.u!==undefined||x.dataset.m!==undefined))return;
  let u=0,m=0;document.querySelectorAll("[data-u]").forEach(i=>u+=parseFloat(i.value)||0);document.querySelectorAll("[data-m]").forEach(i=>m+=parseFloat(i.value)||0);
  const ou=document.getElementById("obju"),om=document.getElementById("objm");if(ou)ou.value=num(u);if(om)om.value=num(m);
});
app.addEventListener("change",async e=>{
  const x=e.target;
  if(x.id==="fm"){S.fM=x.value;render();return}
  if(x.id==="fd"){S.fD=x.value;render();return}
  if(x.id==="fa"){S.fA=x.value;S.calDay="";render();return}
  if(x.id==="cm"){const b=document.getElementById("tecbox");b.hidden=x.value!=="TECNOLOGIA";document.getElementById("ct").required=!b.hidden;if(!b.hidden)document.getElementById("ct").focus();return}
  if(x.id==="mes"){S.mes=x.value;S.dia=null;S.rej=null;S.fD="";S.calDay="";resetEdit();await act(async()=>{await loadMonth();render()});return}
  if(x.id==="todos"){document.getElementById("alis").hidden=x.checked;return}
  if(x.id==="ofimgin"){const file=x.files[0];if(!file)return;x.value="";achicar(file,1200,900000).then(data=>{S.ofImg=data;document.getElementById("ofprev").innerHTML=`<img class="ofimg" src="${data}" alt="Vista previa"><button type="button" class="btn sec sm" data-act="ofimgx">Quitar imagen</button>`;x.closest("label").firstChild.textContent="Cambiar imagen"}).catch(()=>toast("No se pudo leer la imagen. Prueba con otro archivo JPG o PNG."));return}
  if(x.id==="logoin"){const file=x.files[0];if(!file)return;x.value="";achicar(file,160,300000).then(data=>act(async()=>{await setDoc(doc(fs,"logos",slug(S.user.name)),{data});db.logos[S.user.name]=data;render()},"Logo actualizado")).catch(()=>toast("No se pudo leer la imagen"))}
});

app.innerHTML=`<div class="wrap"><div class="empty">Cargando…</div></div>`;
onAuthStateChanged(auth,async u=>{
  if(!u){S.user=null;db.items=[];db.perfil=null;render();return}
  await startSession(u);
});
</script>
</body>
</html>
